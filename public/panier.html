<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier - DEPTO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@latest/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>

  <div id="depto-loader">
    <div class="loader-lottie-container">
      <dotlottie-wc src="images/loader.json" speed="1" style="width: 180px; height: 180px;" loop autoplay></dotlottie-wc>
    </div>
    <div class="loader-text">Chargement DEPTO...</div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">D</span>
        <span class="brand-name">DEPTO</span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="produits.html" class="nav-link">Produits</a>
        <a href="suivi.html" class="nav-link">Suivi</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Changer de theme">
          <span class="theme-icon theme-icon-light">Jour</span>
          <span class="theme-icon theme-icon-dark">Nuit</span>
        </button>
        <a href="panier.html" class="cart-btn">
          Panier <span id="cartCount" class="cart-count">0</span>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>Mon panier</h1>
        </div>

        <div class="cart-layout">
          <div class="cart-items" id="cartItems"></div>

          <aside class="cart-summary">
            <h2>Recapitulatif</h2>
            
            <div class="form-field" style="margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Votre Nom *</label>
              <input type="text" id="clientNom" placeholder="Ex: David N." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px;">
            </div>
            <div class="form-field" style="margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Votre Téléphone *</label>
              <input type="tel" id="clientTel" placeholder="Ex: +243 97..." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px;">
            </div>

            <div class="summary-row">
              <span>Total</span>
              <strong id="cartTotal">0 $</strong>
            </div>
            <button class="btn btn-primary btn-block" id="btnValider">
              Valider la commande
            </button>
            <button class="btn btn-ghost btn-block" id="btnVider">
              Vider le panier
            </button>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="brand-name">DEPTO</p>
        <p class="footer-text">Kinshasa, Republique Democratique du Congo</p>
      </div>
      <div class="footer-links">
        <a href="produits.html">Produits</a>
        <a href="suivi.html">Suivi</a>
        <a href="contact.html">Contact</a>
      </div>
      <p class="footer-copy">2026 DEPTO. Tous droits reserves.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/panier.js"></script>
</body>
</html>
