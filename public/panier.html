          <aside class="cart-summary">
            <h2>Recapitulatif</h2>
            
            <div class="form-field" style="margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Votre Nom *</label>
              <input type="text" id="clientNom" placeholder="Ex: David N." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px;">
            </div>
            <div class="form-field" style="margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">Votre Téléphone *</label>
              <input type="tel" id="clientTel" placeholder="Ex: +243 97..." required style="padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px;">
            </div>

            <div class="summary-row" style="border-bottom: none; margin-bottom: 5px; padding-bottom: 5px;">
              <span>Total Panier</span>
              <strong id="cartTotal" style="color: var(--text-primary); font-size: 18px;">0 $</strong>
            </div>
            <div class="summary-row" style="border-bottom: none; border-top: 1px solid var(--border); margin-bottom: 5px; padding-top: 10px; padding-bottom: 5px;">
              <span style="color: var(--accent-dark); font-weight: bold;">Acompte (60%)</span>
              <strong id="cartAcompte" style="color: var(--accent-dark); font-size: 18px;">0 $</strong>
            </div>
            <div class="summary-row" style="border-bottom: none; margin-bottom: 18px; padding-top: 5px;">
              <span style="color: var(--text-secondary);">Solde (40%)</span>
              <strong id="cartSolde" style="color: var(--text-secondary); font-size: 16px;">0 $</strong>
            </div>
            
            <button class="btn btn-primary btn-block" id="btnValider" style="background: var(--accent); color: #fff;">
              Valider la commande (60%)
            </button>
            <button class="btn btn-ghost btn-block" id="btnVider">
              Vider le panier
            </button>
          </aside>
