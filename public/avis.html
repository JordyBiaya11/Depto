<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avis Clients - DEPTO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@latest/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>
  <div id="depto-loader">
    <div class="loader-lottie-container"><dotlottie-wc src="images/loader.json" speed="1" style="width: 180px; height: 180px;" loop autoplay></dotlottie-wc></div>
    <div class="loader-text">Chargement DEPTO...</div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">D</span><span class="brand-name">DEPTO</span></a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="femme.html" class="nav-link">Femme</a>
        <a href="homme.html" class="nav-link">Homme</a>
        <a href="autres.html" class="nav-link">Autres</a>
        <a href="avis.html" class="nav-link active">Avis</a>
        <a href="panier.html" class="nav-link mobile-cart-link">Panier <span class="cart-count" id="mobileCartCount">0</span></a>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Changer de theme"><span class="theme-icon theme-icon-light">Jour</span><span class="theme-icon theme-icon-dark">Nuit</span></button>
        <a href="panier.html" class="cart-btn">Panier <span id="cartCount" class="cart-count">0</span></a>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container narrow">
        <div class="section-head"><h1>L'avis de nos clients</h1></div>
        <p class="lead">Votre satisfaction est notre priorité. Partagez votre expérience avec DEPTO.</p>
        
        <form class="contact-form" id="avisForm" style="margin-bottom: 40px;">
          <label>Votre Nom <input type="text" id="avisNom" required></label>
          <label>Note (sur 5) 
            <select id="avisNote" style="padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); font-size: 15px;">
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Très bien</option>
              <option value="3">3 - Moyen</option>
              <option value="2">2 - Passable</option>
              <option value="1">1 - Mauvais</option>
            </select>
          </label>
          <label>Votre message <textarea id="avisMessage" rows="4" required></textarea></label>
          <button type="submit" class="btn btn-primary btn-block">Publier mon avis</button>
        </form>

        <div id="listeAvis" style="display: flex; flex-direction: column; gap: 20px;"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div><p class="brand-name">DEPTO</p><p class="footer-text">Kinshasa, RDC</p></div>
      <div class="footer-links"><a href="femme.html">Femme</a><a href="homme.html">Homme</a></div>
      <p class="footer-copy">2026 DEPTO.</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/avis.js"></script>
</body>
</html>
