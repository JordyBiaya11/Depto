<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion admin - DEPTO</title>
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="admin-brand-mark">D</span>
        <span class="admin-brand-name">DEPTO</span>
      </div>

      <h1>Espace administration</h1>
      <p class="login-sub">Connectez-vous pour gerer le catalogue et les commandes.</p>

      <div class="login-error" id="loginError" hidden></div>

      <form class="admin-form" id="loginForm">
        <div class="form-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Se connecter</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/admin-login.js"></script>
</body>
</html>
