<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tableau de bord - DEPTO Admin</title>
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="admin-brand-mark">D</span>
        <div>
          <div class="admin-brand-name">DEPTO</div>
          <div class="admin-brand-sub">Administration</div>
        </div>
      </div>

      <a href="dashboard.html" class="admin-nav-link active">Tableau de bord</a>
      <a href="produits.html" class="admin-nav-link">Produits</a>
      <a href="commandes.html" class="admin-nav-link">Commandes</a>

      <div class="admin-nav-spacer"></div>

      <div class="admin-sidebar-footer">
        <button id="themeToggle">Changer de theme</button>
        <button id="logoutBtn">Deconnexion</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Tableau de bord</h1>
        <div class="admin-topbar-actions">
          <a href="produits.html" class="btn btn-primary">Ajouter un produit</a>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Produits</div>
          <div class="stat-value" id="statProduits">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Commandes</div>
          <div class="stat-value" id="statCommandes">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">En attente</div>
          <div class="stat-value" id="statAttente">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Livrees</div>
          <div class="stat-value" id="statLivrees">0</div>
        </div>
      </div>

      <div class="admin-card">
        <h2>Dernieres commandes</h2>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Client</th>
                <th>Statut</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recentOrders">
              <tr>
                <td colspan="4" class="admin-empty">Aucune commande pour le moment.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/admin-guard.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
